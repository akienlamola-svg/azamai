<style>
:root{
  --rojo:#b3001b; --rojo-osc:#5c000e; --verde:#0c7a3a; --verde-osc:#064d24;
  --oro:#ffcc33; --oro-osc:#b8860b; --rosa:#ff3ea5; --crema:#fff8ec; --tinta:#2b0a0f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--tinta); font-size:16px; line-height:1.45;
  background:#6e0012;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,204,51,.30) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.18) 0 1.5px, transparent 2.5px),
    linear-gradient(180deg,#8a0016,#4a000b);
  background-size:38px 38px,52px 52px,100% 100%;
  min-height:100vh; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--rojo);font-weight:700}
.envoltura{max-width:720px;margin:0 auto;position:relative;z-index:2}

/* Guirnalda de luces */
.luces{display:flex;justify-content:space-around;height:30px;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top)}
.luces::before{content:'';position:absolute;left:-5%;right:-5%;top:calc(env(safe-area-inset-top) - 6px);height:16px;border-bottom:3px solid #0d3b1c;border-radius:0 0 50% 50%/0 0 100% 100%}
.bombilla{width:10px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:12px;background:currentColor;box-shadow:0 0 12px 2px currentColor;animation:parpadeo 1.1s infinite alternate}
@keyframes parpadeo{from{opacity:1}to{opacity:.2}}

/* Nieve */
.copo{position:fixed;top:-24px;color:#fff;pointer-events:none;z-index:1;animation:caer linear infinite;opacity:.85;text-shadow:0 0 6px #fff}
@keyframes caer{to{transform:translateY(112vh) rotate(360deg)}}

/* Cabecera */
.nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 10px;background:linear-gradient(#0c7a3a,#064d24);border-bottom:4px solid var(--oro);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.nav a{color:#fff7d6;text-decoration:none;font-weight:900;padding:6px 12px;border-radius:999px;font-size:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,204,51,.5)}
.nav a.activo{background:var(--oro);color:var(--rojo-osc)}
.hero{text-align:center;padding:18px 12px 6px;color:#fff3c4}
.escudo{font-size:44px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,204,51,.8))}
.titulo{font-family:'Mountains of Christmas',cursive;font-weight:700;font-size:clamp(56px,17vw,104px);margin:0;line-height:.95;
  background:linear-gradient(100deg,#fff6c2,#ffcc33 30%,#ffffff 45%,#e0a000 60%,#ffeaa0);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 3s linear infinite;
  filter:drop-shadow(0 3px 0 #3d0009) drop-shadow(0 0 14px rgba(255,204,51,.55))}
@keyframes brillo{to{background-position:-200% 0}}
.subtitulo{font-family:'Lobster',cursive;font-size:20px;margin:4px 0 0;color:#ffe9a8;text-shadow:0 2px 0 #3d0009}
.lema{font-style:italic;font-size:14px;opacity:.85;margin:6px 0 0}
.cinta{display:inline-block;margin:12px auto 0;background:var(--oro);color:var(--rojo-osc);font-weight:900;padding:6px 16px;border-radius:4px;transform:rotate(-1.5deg);box-shadow:0 3px 0 #8a6500;font-size:14px}

/* Tarjetas con borde de bastón de caramelo */
.tarjeta{margin:18px 12px;padding:18px 16px;border-radius:18px;position:relative;
  border:7px solid transparent;
  background-image:linear-gradient(var(--crema),var(--crema)),repeating-linear-gradient(45deg,#d4001f 0 10px,#fff 10px 20px,#0c7a3a 20px 30px,#fff 30px 40px);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 0 3px var(--oro)}
.tarjeta h2{font-family:'Lobster',cursive;font-weight:400;color:var(--rojo);margin:0 0 10px;font-size:26px;line-height:1.1}
.tarjeta h2 .adorno{color:var(--oro-osc)}
.tarjeta h3{font-family:'Lobster',cursive;font-weight:400;color:var(--verde);margin:16px 0 6px;font-size:21px}
.tarjeta p{margin:8px 0}
.tarjeta.presi{background-image:linear-gradient(#fff2fa,#fff2fa),repeating-linear-gradient(45deg,#ff3ea5 0 10px,#ffcc33 10px 20px)}
.tarjeta.prueba{background-image:linear-gradient(#eef6ff,#eef6ff),repeating-linear-gradient(45deg,#1d4ed8 0 10px,#fff 10px 20px)}
details.tarjeta>summary{list-style:none;cursor:pointer}
details.tarjeta>summary::-webkit-details-marker{display:none}
details.tarjeta>summary h2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0}
details.tarjeta>summary h2::after{content:'▾';font-family:'Nunito';font-size:18px;color:var(--oro-osc)}
details.tarjeta[open]>summary h2{margin-bottom:10px}
details.tarjeta[open]>summary h2::after{content:'▴'}
.estatutos p{font-family:Georgia,'Times New Roman',serif}
.estatutos b{color:var(--rojo)}

/* Jerséis horribles con siglas */
.bola{position:relative;width:78px;height:78px;margin:12px auto 4px;flex:none}
.bola svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.bola.xl{width:150px;height:150px}
.bola.s{width:46px;height:46px;margin:0}
.corona{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:26px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.bola.xl .corona{top:-38px;font-size:42px}
.bola.s .corona{top:-14px;font-size:16px}

/* Censo */
.censo{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.socio{display:block;text-align:center;text-decoration:none;color:var(--tinta);background:#fff;border-radius:14px;padding:4px 4px 10px;border:2px solid #f1d58a;position:relative}
.socio .n{font-weight:900;display:block;font-size:15px;line-height:1.15}
.socio .t{font-size:11px;color:#8a5a5a;display:block}
.cartel{font-family:'Lobster',cursive;font-size:13px;padding:4px 7px;border-radius:4px;transform:rotate(-3deg);display:inline-block;margin-top:6px;line-height:1.1}
.cartel.pend{background:#ffe600;color:#b3001b;border:2px dashed #b3001b;animation:temblor 2.8s infinite}
.cartel.ok{background:var(--verde);color:#ffe8a3;border:2px solid var(--oro)}
.cartel.gris{background:#eee;color:#666;border:1px solid #ccc;transform:none}
@keyframes temblor{0%,88%,100%{transform:rotate(-3deg)}91%{transform:rotate(3deg)}94%{transform:rotate(-5deg)}97%{transform:rotate(2deg)}}

/* Mensajes */
.msg{display:flex;gap:10px;padding:12px;border-radius:14px;background:#fff;border:2px solid #f3d27a;margin:10px 0;position:relative}
.msg .ico{font-size:26px;line-height:1.1;flex:none}
.msg .cuerpo{flex:1;min-width:0;overflow-wrap:anywhere}
.msg .fecha{font-size:12px;color:#8a5a5a;margin-top:4px}
.msg .de{font-size:12px;font-weight:900;color:var(--verde);text-transform:uppercase;letter-spacing:.04em}
.msg.reproche{background:#fff0f0;border-color:#ff6b6b}
.msg.reproche.duro{background:#ffe3e3;border:3px solid #d4001f}
.msg.solemne{background:#fffbe6;border:3px double var(--oro-osc);font-family:Georgia,'Times New Roman',serif}
.msg.fiesta{background:linear-gradient(135deg,#eaffef,#fffbe0);border-color:var(--verde)}
.msg.presi{background:#fff0f8;border-color:var(--rosa)}
.msg.sistema{background:#f4f7ff;border-color:#9db4ff}
.msg.cambio{background:#fff7e6;border-color:#ffa94d}
.msg .nuevo{position:absolute;top:-8px;right:10px;background:var(--rosa);color:#fff;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px}
.msg .borrar{position:absolute;bottom:6px;right:8px;background:none;border:0;color:#b3001b;font-size:13px;cursor:pointer}
.vacio{color:#8a5a5a;font-style:italic}

/* Sobre */
.sobre{text-align:center;padding:16px;border-radius:14px;background:repeating-linear-gradient(-45deg,#fff 0 12px,#ffe9ef 12px 24px);border:3px dashed var(--rojo)}
.sobre .quien{font-family:'Lobster',cursive;font-size:34px;color:var(--rojo);margin:4px 0}

/* Formularios */
label{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=password],input[type=url],input:not([type]),textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:3px solid var(--oro);background:#fff;color:var(--tinta)}
textarea{min-height:140px;resize:vertical}
label.check{display:flex;gap:8px;align-items:center;font-weight:400}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.btn{font:inherit;font-weight:900;border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(#ff3b5c,#b3001b);color:#fff;box-shadow:0 4px 0 #5c000e;cursor:pointer;font-size:16px;line-height:1.1}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5c000e}
.btn.oro{background:linear-gradient(#ffe48a,#e0a800);color:#5c000e;box-shadow:0 4px 0 #8a6500}
.btn.verde{background:linear-gradient(#22b35e,#0c7a3a);box-shadow:0 4px 0 #064d24}
.btn.rosa{background:linear-gradient(#ff7ac4,#e0157f);box-shadow:0 4px 0 #8a0a4d}
.btn.azul{background:linear-gradient(#5b8cff,#1d4ed8);box-shadow:0 4px 0 #0f2a7a}
.btn.peq{padding:8px 13px;font-size:14px}
.btn.grande{font-size:19px;padding:15px 22px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dictando{animation:latido 1s infinite}
@keyframes latido{50%{transform:scale(1.06)}}
.enlaces{list-style:none;padding:0;margin:8px 0}
.enlaces li{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #f1d58a;border-radius:10px;padding:6px 10px;margin:6px 0;overflow-wrap:anywhere}
.enlaces li a{flex:1}
.nota{font-size:13px;color:#7a4a4a}
.carta{background:#fffef6;border-radius:12px;padding:14px;border:2px solid #e8d49a;font-family:Georgia,'Times New Roman',serif;white-space:pre-wrap;overflow-wrap:anywhere;
  background-image:repeating-linear-gradient(transparent 0 27px,#f2e3b6 27px 28px)}
.carta-cab{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.carta-cab b{font-family:'Lobster',cursive;font-size:22px;color:var(--rojo);font-weight:400}
.pregunta{background:#fff;border:2px solid #c7b2ff;border-radius:14px;padding:12px;margin:10px 0}
.pregunta .q{font-weight:700}
.pregunta .r{margin-top:8px;padding:8px 10px;background:#eefbf2;border-radius:10px;border-left:4px solid var(--verde)}
.pregunta .r.pend{background:#fff4e0;border-left-color:#ff9800;font-style:italic}

/* Instalar */
.pasos{counter-reset:p;list-style:none;padding:0}
.pasos li{counter-increment:p;position:relative;padding:8px 0 8px 46px;margin:6px 0}
.pasos li::before{content:counter(p);position:absolute;left:0;top:6px;width:34px;height:34px;border-radius:50%;background:var(--rojo);color:#fff;font-weight:900;display:grid;place-items:center;border:2px solid var(--oro)}
.aviso-instalar{margin:12px;padding:10px 14px;background:var(--oro);border-radius:12px;color:var(--rojo-osc);font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 0 #8a6500}
.aviso-instalar a{color:var(--rojo-osc)}

/* Capas */
.capa{position:fixed;inset:0;background:rgba(30,0,6,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.capa .tarjeta{width:100%;max-width:680px;max-height:86vh;overflow:auto;margin:0}
.ocupado{position:fixed;inset:0;z-index:60;background:rgba(30,0,6,.8);display:grid;place-items:center;color:#fff3c4;text-align:center;font-weight:900;font-size:19px;padding:20px}
.ocupado .giro{font-size:52px;animation:giro 1.4s linear infinite;display:inline-block}
@keyframes giro{to{transform:rotate(360deg)}}
.tostada{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#1f0006;color:#fff3c4;padding:12px 18px;border-radius:14px;border:2px solid var(--oro);max-width:92vw;box-shadow:0 8px 20px rgba(0,0,0,.4);font-weight:700;text-align:center}
.boton-prueba{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#5b8cff,#1d4ed8);color:#fff;font-size:26px;box-shadow:0 6px 14px rgba(0,0,0,.4);cursor:pointer}
.franja-prueba{background:repeating-linear-gradient(45deg,#1d4ed8 0 14px,#2b5cf0 14px 28px);color:#fff;text-align:center;font-weight:900;font-size:13px;padding:5px 10px}
.franja-prueba.supervisado{background:repeating-linear-gradient(45deg,#e0157f 0 14px,#ff3ea5 14px 28px)}
table.pares{width:100%;border-collapse:collapse;font-size:15px}
table.pares td{padding:6px 4px;border-bottom:1px dashed #c9b37a}
pre.acta{white-space:pre-wrap;font-size:13px;background:#fffef6;border:1px solid #e8d49a;padding:10px;border-radius:10px}
.pie{text-align:center;color:#ffe9a8;font-size:13px;padding:24px 16px 90px;opacity:.9}
.perfil-cab{text-align:center;padding-top:20px}
.perfil-cab h2{font-size:34px;margin:4px 0 0}
.cargo{display:inline-block;background:var(--verde);color:#ffe8a3;font-weight:900;font-size:13px;padding:3px 12px;border-radius:999px;margin-top:4px}
.cargo.presi{background:linear-gradient(90deg,#ff3ea5,#ffcc33);color:#5c000e}
.contador{font-family:'Lobster',cursive;font-size:22px;color:var(--verde);text-align:center;margin:6px 0}
@media (prefers-reduced-motion:reduce){.copo,.bombilla,.titulo,.cartel.pend,.ocupado .giro{animation:none}}
</style>
</head>

/* ---------- Criptografía: el sorteo queda sellado ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const azar = n => crypto.getRandomValues(new Uint8Array(n));
const ITER = 250000;
async function llavePin(pin, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function crearLlaves(pin){
  const kp = await crypto.subtle.generateKey({name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'}, true, ['encrypt','decrypt']);
  const pub = await crypto.subtle.exportKey('jwk', kp.publicKey);
  const pkcs8 = await crypto.subtle.exportKey('pkcs8', kp.privateKey);
  const salt = azar(16), iv = azar(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await llavePin(pin, salt), pkcs8);
  const priv = await crypto.subtle.importKey('pkcs8', pkcs8, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']);
  return { doc:{ pub:{kty:pub.kty, n:pub.n, e:pub.e, alg:pub.alg}, privEnc:{salt:b64(salt), iv:b64(iv), ct:b64(ct)}, keyId:b64(azar(6)) }, priv };
}
async function abrirLlave(privEnc, pin){
  const pkcs8 = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(privEnc.iv)}, await llavePin(pin, unb64(privEnc.salt)), unb64(privEnc.ct));
  return crypto.subtle.importKey('pkcs8', pkcs8, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']);
}
async function sellar(pubJwk, texto){
  const pk = await crypto.subtle.importKey('jwk', pubJwk, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['encrypt']);
  const k = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt']);
  const iv = azar(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, te.encode(texto));
  const ek = await crypto.subtle.encrypt({name:'RSA-OAEP'}, pk, await crypto.subtle.exportKey('raw', k));
  return {iv:b64(iv), ct:b64(ct), ek:b64(ek)};
}
async function abrirSobre(priv, s){
  const raw = await crypto.subtle.decrypt({name:'RSA-OAEP'}, priv, unb64(s.ek));
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(s.iv)}, k, unb64(s.ct)));
}

async function codigoValido(id, codigo){
  const c = String(codigo || '').toUpperCase().replace(/\s+/g, '').split('-').pop();
  if (!/^[A-Z0-9]{6}$/.test(c) || !CODIGOS[id]) return false;
  const base = await crypto.subtle.importKey('raw', te.encode(c), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:te.encode('azamai:' + id), iterations:100000, hash:'SHA-256'}, base, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('') === CODIGOS[id];
}

/* ---------- El sorteo ---------- */
const alAzar = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const barajar = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--){ const j = alAzar(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const prohibido = (a, b) => a === b || PAREJAS.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
function sortear(sinReciprocos = true){
  const dadores = barajar(IDS), pares = {}, usados = new Set();
  const paso = i => {
    if (i === dadores.length) return true;
    for (const r of barajar(IDS)){
      if (usados.has(r) || prohibido(dadores[i], r) || (sinReciprocos && pares[r] === dadores[i])) continue;
      pares[dadores[i]] = r; usados.add(r);
      if (paso(i + 1)) return true;
      usados.delete(r); delete pares[dadores[i]];
    }
    return false;
  };
  if (!paso(0)){
    if (sinReciprocos) return sortear(false);   // si fuera imposible evitar todos los recíprocos
    throw new Error('No hay combinación posible');
  }
  verificar(pares);
  return pares;
}
const reciprocos = pares => Object.keys(pares).filter(a => pares[pares[a]] === a && a < pares[a]).length;
function verificar(pares){
  const dan = Object.keys(pares), reciben = Object.values(pares);
  if (dan.length !== IDS.length || !IDS.every(id => id in pares)) throw new Error('Alguien se ha quedado sin regalar');
  if (new Set(reciben).size !== IDS.length || !IDS.every(id => reciben.includes(id))) throw new Error('Alguien se ha quedado sin regalo o recibe dos');
  for (const d of dan) if (prohibido(d, pares[d])) throw new Error('Regalo prohibido: ' + d + ' → ' + pares[d]);
  return true;
}

const TABLA_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function almacenEnsayo(){
  const K = 'azamai-ensayo';
  const leer = () => { try { return JSON.parse(ls.get(K) || '{}'); } catch(e){ return {}; } };
  let datos = leer(); const subs = {};
  const lista = c => Object.entries(datos[c] || {}).map(([id, d]) => ({id, ...d}));
  const emitir = c => (subs[c] || []).forEach(cb => cb(lista(c)));
  const guardar = c => { ls.set(K, JSON.stringify(datos)); emitir(c); };
  window.addEventListener('storage', e => { if (e.key === K){ datos = leer(); Object.keys(subs).forEach(emitir); } });
  return {
    tipo:'ensayo',
    async getDoc(c, id){ return datos[c]?.[id] ? JSON.parse(JSON.stringify(datos[c][id])) : null; },
    async setDoc(c, id, d, merge = true){ datos[c] = datos[c] || {}; datos[c][id] = merge ? {...(datos[c][id] || {}), ...d} : d; guardar(c); },
    async delDoc(c, id){ if (datos[c]) delete datos[c][id]; guardar(c); },
    async addDoc(c, d){ datos[c] = datos[c] || {}; datos[c]['m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)] = d; guardar(c); },
    watchCol(c, cb){ (subs[c] = subs[c] || []).push(cb); setTimeout(() => cb(lista(c)), 0); return () => { subs[c] = (subs[c] || []).filter(x => x !== cb); }; }
  };
}
async function almacenFirebase(cfg){
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const app = await import(base + 'firebase-app.js');
  const fs = await import(base + 'firebase-firestore.js');
  const au = await import(base + 'firebase-auth.js');
  const a = app.initializeApp(cfg);
  await au.signInAnonymously(au.getAuth(a));
  let db;
  try { db = fs.initializeFirestore(a, {experimentalAutoDetectLongPolling:true}); } catch(e){ db = fs.getFirestore(a); }
  return {
    tipo:'firebase',
    async getDoc(c, id){ const s = await fs.getDoc(fs.doc(db, c, id)); return s.exists() ? s.data() : null; },
    async setDoc(c, id, d, merge = true){ await fs.setDoc(fs.doc(db, c, id), d, {merge}); },
    async delDoc(c, id){ await fs.deleteDoc(fs.doc(db, c, id)); },
    async addDoc(c, d){ await fs.addDoc(fs.collection(db, c), d); },
    watchCol(c, cb, alFallar){ return fs.onSnapshot(fs.collection(db, c), snap => cb(snap.docs.map(d => ({id:d.id, ...d.data()}))), err => { console.error(err); if (alFallar) alFallar(err); }); }
  };
}

// Los reproches llegan alternando cada 2 y 3 días: días 2, 5, 7, 10, 12, 15...
const umbralReproche = k => Math.floor(k * 2.5);
function reprochesDe(id){
  const out = [], ini = S.estado.fechaValidacion, ya = ahoraISO();
  if (!ini) return out;
  for (let k = 1; k <= 60; k++){
    const f = sumarDias(ini, umbralReproche(k));
    if (f > ya) break;
    const t = TXT.reproches[Math.min(k - 1, TXT.reproches.length - 1)];
    out.push({fecha:f, nivel:k, clase:'reproche' + (k >= 5 ? ' duro' : ''), ico:k >= 7 ? '👑💢' : k >= 3 ? '🐪💢' : '👑⏰', de:k >= 5 ? 'Requerimiento de Sus Majestades' : 'Sus Majestades', html:esc(t(nom(id)))});
  }
  return out;
}

/* ---------- Componentes ---------- */
let nJersey = 0;
function motivo(tipo, y, color){
  let g = '';
  for (let x = 5; x < 100; x += 10){
    if (tipo === 0) g += `<polyline points="${x - 5},${y + 3} ${x},${y - 3} ${x + 5},${y + 3}" fill="none" stroke="${color}" stroke-width="2"/>`;
    else if (tipo === 1) g += `<polygon points="${x},${y - 4} ${x + 4},${y} ${x},${y + 4} ${x - 4},${y}" fill="${color}"/>`;
    else if (tipo === 2) g += `<polygon points="${x},${y - 5} ${x + 4},${y + 3} ${x - 4},${y + 3}" fill="${color}"/><rect x="${x - 1}" y="${y + 3}" width="2" height="2" fill="${color}"/>`;
    else if (tipo === 3) g += `<circle cx="${x}" cy="${y + ((x / 10) % 2 ? -2 : 2)}" r="2.2" fill="${color}"/>`;
    else if (tipo === 4) g += `<path d="M${x - 3.5} ${y}h7M${x} ${y - 3.5}v7M${x - 2.5} ${y - 2.5}l5 5M${x + 2.5} ${y - 2.5}l-5 5" stroke="${color}" stroke-width="1.3"/>`;
    else g += `<path d="M${x} ${y + 4} l-4 -4 a2.2 2.2 0 0 1 4 -2.5 a2.2 2.2 0 0 1 4 2.5 z" fill="${color}"/>`;
  }
  return g;
}
function jerseySVG(id){
  const [fondo, franja, adorno, letra] = PALETAS[id] || ['#c8102e', '#fff', '#0b7a3a', '#fff'];

  return `<svg viewBox="0 0 100 100" role="img" aria-label="Jersey de ${esc(nom(id))}"><defs><clipPath id="${u}"><path d="${cuerpo}"/></clipPath></defs>

      <rect x="0" y="71" width="100" height="11" fill="${franja}"/>${motivo((i + 3) % 6, 76.5, adorno)}
      <rect x="26" y="87" width="48" height="8" fill="${adorno}"/>

      <path d="M8 79l-1 6M11.5 79.6l-1 6.5M15 80.2l-1 6.8M92 79l1 6M88.5 79.6l1 6.5M85 80.2l1 6.8" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>
    </g>
    <path d="${cuerpo}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1.2" stroke-linejoin="round"/>

function deDoc(m){ const [clase, ico, de] = ESTILO[m.tipo] || ESTILO.sistema; return {fecha:m.fecha, clase, ico, de, html:m.html ? m.html : enlazar(m.texto).replace(/\n/g, '<br>'), docId:m.id}; }

  // Reproches públicos: un único aviso, siempre arriba del todo, que señala a todos los rezagados
  let fijo = null;
  if (fase() === 'validado' && !todas){

    } else {

    }
  }
  const orden = items.filter(m => m.fecha).sort((a, b) => b.fecha.localeCompare(a.fecha));

function feedPerfil(id){
  const items = mensajesPara(id).map(deDoc);
  const est = S.estado, ya = ahoraISO();
  if (est.fechaSorteo && est.fase !== 'abierta') items.push({fecha:est.fechaSorteo, clase:'sistema', ico:'🎲', de:'Secretaría de AZAMAI', html:TXT.sorteoPersonal});
  if (fase() === 'validado'){
    const a = amigo();
    if (a) items.push({fecha:est.fechaValidacion, clase:'solemne', ico:'📜', de:'La suprema autoridad', html:TXT.revelacion(nom(a))});
    const mia = cartaDe(id);
    if (!mia?.enviada) items.push(...reprochesDe(id));
    // Preguntas recibidas sin responder: aviso y recordatorios cada 2 días
    preguntasRonda().filter(p => p.para === id).forEach(p => {
      items.push({fecha:p.fecha, clase:'presi', ico:'🤫', de:'Consultorio anónimo', html:`Tu amigo invisible te ha hecho una pregunta anónima: «${enlazar(p.texto)}». Respóndela en la sección «Preguntas que te han hecho»; tu respuesta se publicará en el inicio.`});
      if (!p.respuesta){
        for (let k = 1; ; k++){
          const f = sumarDias(p.fecha, 2 * k);
          if (f > ya || k > 60) break;
          items.push({fecha:f, clase:'reproche', ico:'⏰', de:'Recordatorio', html:esc(TXT.recordatorios[Math.min(k - 1, TXT.recordatorios.length - 1)]())});
        }
      }
    });
    if (a){
      const ca = cartaDe(a);
      (ca?.ediciones || []).forEach((f, i) => items.push({fecha:f, clase:'cambio', ico:'🖋️', de:'Mensajería Real',
        html:`Tu amigo invisible, <b>${esc(nom(a))}</b>, ha modificado su carta (versión ${i + 2}). ${todasEnviadas() ? 'Revísala abajo, no vayas a regalarle lo que ya no quiere.' : 'Podrás leerla cuando todas las cartas estén enviadas.'}`}));
      preguntasRonda().filter(p => p.para === a && p.respuesta).forEach(p => items.push({fecha:p.fechaRespuesta, clase:'fiesta', ico:'💬', de:'Consultorio anónimo', html:`${esc(nom(a))} ha respondido a tu pregunta «${esc(p.texto)}»: <b>${enlazar(p.respuesta)}</b>`}));
      const fp = fechaPublicacion();
      if (fp) items.push({fecha:fp, clase:'fiesta', ico:'📬', de:'Buzón real', html:`¡Todas las cartas han llegado! Ya puedes leer la carta de <b>${esc(nom(a))}</b> más abajo.`});
    }
  }
  return items.filter(m => m.fecha).sort((x, y) => y.fecha.localeCompare(x.fecha));
}
function vistaMensajes(id){
  const it = feedPerfil(id);

  const nuevos = ui.ultimaVisita ? it.filter(m => m.fecha > ui.ultimaVisita).length : 0;

    ${viejos.length ? `<details class="pregunta" id="d-msg-antiguos"><summary style="cursor:pointer;font-weight:900">🗄️ Ver ${viejos.length} mensaje${viejos.length > 1 ? 's' : ''} anterior${viejos.length > 1 ? 'es' : ''}</summary>${viejos.map(m => msgHTML(m)).join('')}</details>` : ''}</section>`;
}

/* ---------- Pintado ---------- */
let pintPend = false;
function pintar(){ if (pintPend) return; pintPend = true; requestAnimationFrame(() => { pintPend = false; pintarYa(); }); }
function pintarYa(){
  // Conservar lo que el usuario está escribiendo
  const guard = {}, act = document.activeElement;
  document.querySelectorAll('#app input[id],#app textarea[id],#app select[id],#capas input[id],#capas textarea[id],#capas select[id]').forEach(el => { guard[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  const abiertos = {}; document.querySelectorAll('details[id]').forEach(d => abiertos[d.id] = d.open);
  const foco = act?.id, sel = act && 'selectionStart' in act ? [act.selectionStart, act.selectionEnd] : null;
  const y = window.scrollY;

  if (sesion && !sesion.supervisado && S.cargado.socios && S.socios[sesion.id]?.keyId !== sesion.keyId){ sesion = null; ls.del('azamai-sesion'); tostada('Tu PIN ha sido restablecido por la Presidencia. Crea uno nuevo.'); }
  const ruta = location.hash.replace(/^#\/?/, '') || 'inicio';
  const m = ruta.match(/^socio[-/]([a-z]+)/);
  $('#app').innerHTML = m ? vistaPerfil(m[1]) : ruta === 'instalar' ? vistaInstalar() : vistaInicio();
  $('#nav').innerHTML = `<a href="#inicio" class="${ruta === 'inicio' ? 'activo' : ''}">🏠 Inicio</a>${sesion ? `<a href="#socio-${sesion.id}" class="${m && m[1] === sesion.id ? 'activo' : ''}">🎁 ${esc(nom(sesion.id))}</a>` : ''}<a href="#instalar" class="${ruta === 'instalar' ? 'activo' : ''}">📲 Instalar</a><a href="#${ruta}" data-a="actualizar" aria-label="Actualizar">🔄</a>`;
  $('#franja').innerHTML = MODO_PRUEBA ? `<div class="franja-prueba ${sesion?.supervisado ? 'supervisado' : ''}">VERSIÓN DE PRUEBA ${VERSION}${S.sincronizado ? ` · al día ${new Date(S.sincronizado).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})}` : ' · conectando…'}${DB?.tipo === 'ensayo' ? ' · MODO ENSAYO (solo este dispositivo)' : ''}${desfaseDias ? ` · RELOJ +${desfaseDias} DÍAS` : ''}${sesion?.supervisado ? ` · VIENDO COMO ${esc(nom(sesion.id).toUpperCase())}` : ''}</div>` : '';
  let capas = '';
  if (MODO_PRUEBA) capas += `<button class="boton-prueba" data-a="abrir-prueba" aria-label="Panel de prueba">🔧</button>`;
  if (ui.prueba) capas += `<div class="capa" data-a="fondo-capa">${vistaPanelPrueba()}</div>`;
  if (ui.modal) capas += `<div class="capa" data-a="fondo-capa"><section class="tarjeta"><h2>${ui.modal.titulo}</h2>${ui.modal.html}<div class="fila"><button class="btn peq oro" data-a="cerrar-capa">Cerrar</button></div></section></div>`;
  if (ui.confirmacion) capas += `<div class="capa"><section class="tarjeta"><h2><span class="adorno">✦</span> Confirmación</h2><p>${esc(ui.confirmacion.texto)}</p><div class="fila"><button class="btn verde" data-a="conf-si">Sí, adelante</button><button class="btn oro" data-a="conf-no">Mejor no</button></div></section></div>`;
  if (ui.ocupado) capas += `<div class="ocupado"><div><div class="giro">⭐</div><p>${esc(ui.ocupado)}</p></div></div>`;
  $('#capas').innerHTML = capas;

  for (const [k, v] of Object.entries(guard)){ const el = document.getElementById(k); if (!el) continue; if (el.type === 'checkbox') el.checked = v; else if (el.id !== 'carta-texto') el.value = v; }
  for (const [k, v] of Object.entries(abiertos)){ const d = document.getElementById(k); if (d) d.open = v; }
  if (foco){ const el = document.getElementById(foco); if (el){ el.focus({preventScroll:true}); if (sel && 'setSelectionRange' in el){ try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } } }
  window.scrollTo(0, y);
}

/* ---------- Acciones ---------- */
function confirmar(texto){
  return new Promise(res => { ui.confirmacion = {texto, res}; pintarYa(); });
}
function cerrarConfirmacion(valor){ const c = ui.confirmacion; ui.confirmacion = null; if (c) c.res(valor); }
async function ocupado(texto, fn){
  ui.ocupado = texto; pintarYa();
  await new Promise(r => setTimeout(r, 30));
  try { return await fn(); }
  catch(e){ console.error(e); tostada('⚠️ ' + (e.message || e)); }
  finally { ui.ocupado = ''; pintar(); }
}
function guardarSesion(id, pin){ ls.set('azamai-sesion', JSON.stringify({id, pin})); }
async function darDeAlta(id, pin){
  const ya = await DB.getDoc('socios', id);
  if (ya?.pub) throw new Error(`${nom(id)} ya tenía PIN. Si no fuiste tú, avisa a la Presidenta.`);
  const {doc, priv} = await crearLlaves(pin);
  await DB.setDoc('socios', id, {...doc, alta:ahoraISO()}, false);
  const renovado = S.mensajes.some(m => m.para === id && m.tipo === 'registro');
  if (renovado){
    await DB.addDoc('mensajes', {para:id, tipo:'registro', ronda:null, fecha:ahoraISO(), html:'Tu nuevo PIN ha quedado registrado. La Presidencia, en su infinita magnanimidad, te concede una nueva oportunidad. No la desaproveches.'});
  } else {
    await DB.addDoc('mensajes', {para:id, tipo:'registro', ronda:null, fecha:ahoraISO(), html:TXT.registro(id)});
    await DB.addDoc('mensajes', {para:'todos', tipo:'registro', ronda:null, fecha:ahoraISO(), texto:TXT.registroPublico(id)});
  }
  return {priv, keyId:doc.keyId};
}
async function enviarCarta(id, texto, enlaces){
  const k = `${ronda()}_${id}`, c = S.cartas[k], f = ahoraISO();
  if (!c?.enviada){
    await DB.setDoc('cartas', k, {ronda:ronda(), socio:id, texto, enlaces, enviada:true, fechaEnvio:f, fechaUltima:f, version:1, ediciones:[]}, false);
    await DB.addDoc('mensajes', {para:id, tipo:'felicitacion', ronda:ronda(), fecha:f, texto:TXT.felicitacionPersonal});
    await DB.addDoc('mensajes', {para:'todos', tipo:'felicitacion', ronda:ronda(), fecha:f, texto:TXT.felicitacionPublica(id)});
  } else {
    const v = (c.version || 1) + 1;
    await DB.setDoc('cartas', k, {texto, enlaces, fechaUltima:f, version:v, ediciones:[...(c.ediciones || []), f]});
    await DB.addDoc('mensajes', {para:'todos', tipo:'cambio', ronda:ronda(), fecha:f, texto:TXT.cambiosPublicos[(v - 2) % TXT.cambiosPublicos.length](nom(id), v)});
  }
}
async function celebrarSorteo(){
  const pares = sortear();
  const r = 'r' + Date.now().toString(36), f = ahoraISO();
  for (const id of IDS){
    const so = S.socios[id];
    await DB.setDoc('asignaciones', `${r}_${id}`, {ronda:r, socio:id, keyId:so.keyId, sobre:await sellar(so.pub, pares[id])}, false);
  }
  await DB.setDoc('actas', r, {ronda:r, fecha:f, sobre:await sellar(S.socios[PRESIDENTA].pub, JSON.stringify({pares, fecha:f, ronda:r}))}, false);
  if (MODO_PRUEBA) await DB.setDoc('azamai', 'prueba', {ronda:r, pares, fecha:f}, false);
  await DB.setDoc('azamai', 'estado', {ronda:r, fase:'sorteado', fechaSorteo:f, fechaValidacion:null}, false);
  await DB.addDoc('mensajes', {para:'todos', tipo:'sistema', ronda:r, fecha:f, texto:'🎲 ' + TXT.sorteoPublico});
  return {pares, f, r};
}
async function leerActa(){
  const a = S.actas[ronda()];
  if (a && sesion?.priv){ try { return JSON.parse(await abrirSobre(sesion.priv, a.sobre)); } catch(e){} }
  if (MODO_PRUEBA && S.prueba?.ronda === ronda()) return {pares:S.prueba.pares, fecha:S.prueba.fecha || S.estado.fechaSorteo, ronda:ronda()};
  throw new Error('No se ha podido abrir el acta con esta llave.');
}

const acciones = {
  'actualizar'(el, ev){ ev.preventDefault(); if (DB) window.reconectar(); tostada('🔄 Actualizando…', 1500); },
  'conf-si'(){ cerrarConfirmacion(true); },
  'conf-no'(){ cerrarConfirmacion(false); },
  'abrir-prueba'(){ ui.prueba = true; },
  'cerrar-capa'(){ ui.prueba = false; ui.modal = null; },
  'fondo-capa'(el, ev){ if (ev.target === el){ ui.prueba = false; ui.modal = null; } },
  'sobre'(){ ui.sobre = !ui.sobre; },
  'salir'(){ sesion = null; ls.del('azamai-sesion'); ui.sobre = false; ui.editor = null; location.hash = '#inicio'; },
  async 'registrar'(el){
    const id = el.dataset.id, p1 = $('#pin1').value.trim(), p2 = $('#pin2').value.trim();
    if (!/^\d{4,8}$/.test(p1)) return tostada('El PIN debe tener entre 4 y 8 cifras.');
    if (p1 !== p2) return tostada('Los dos PIN no coinciden. Concentración, por favor.');
    const recordar = $('#recordar').checked, codigo = $('#codigo').value;
    await ocupado('Inscribiendo en el Libro Registro y forjando tu llave…', async () => {
      if (!await codigoValido(id, codigo)) throw new Error(`Ese no es el código de invitación de ${nom(id)}. Revisa el WhatsApp que te llegó.`);
      const {priv, keyId} = await darDeAlta(id, p1);
      sesion = {id, priv, keyId}; ui.ultimaVisita = null; ls.set('azamai-visita-' + id, ahoraISO());
      if (recordar) guardarSesion(id, p1);
      tostada('🎖️ ¡Ya eres de AZAMAI! Lee tu acta de incorporación.');
    });
  },
  async 'entrar'(el){
    const id = el.dataset.id, pin = $('#pin').value.trim(), recordar = $('#recordar').checked;
    await ocupado('Comprobando credenciales ante Sus Majestades…', async () => {
      try { sesion = {id, priv:await abrirLlave(S.socios[id].privEnc, pin), keyId:S.socios[id].keyId}; }
      catch(e){ throw new Error('PIN incorrecto. Los camellos toman nota. 🐪'); }
      ui.ultimaVisita = ls.get('azamai-visita-' + id); ls.set('azamai-visita-' + id, ahoraISO());
      cacheAmigo = {}; ui.sobre = false; ui.editor = null;
      if (recordar) guardarSesion(id, pin);
    });
  },
  'dictar'(){
    if (ui.dictado){ try { ui.dictado.stop(); } catch(e){} ui.dictado = null; return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return tostada('Este navegador no deja dictar desde la app. Toca el cuadro de texto y usa el micrófono 🎤 del teclado.', 6000);
    const r = new SR(); r.lang = 'es-ES'; r.continuous = true; r.interimResults = false;
    r.onresult = e => {
      const t = [...e.results].slice(e.resultIndex).filter(x => x.isFinal).map(x => x[0].transcript).join(' ').trim();
      if (!t || !ui.editor) return;
      const ta = $('#carta-texto'); const base = ta ? ta.value : ui.editor.texto;
      ui.editor.texto = (base + (base && !/\s$/.test(base) ? ' ' : '') + t);
      if (ta) ta.value = ui.editor.texto;
      guardarBorrador(); pintar();
    };
    r.onerror = e => { tostada('Dictado detenido: ' + e.error); ui.dictado = null; pintar(); };
    r.onend = () => { ui.dictado = null; pintar(); };
    try { r.start(); ui.dictado = r; tostada('🎤 Habla ahora. Sus Majestades escuchan.'); } catch(e){ tostada('No se pudo iniciar el dictado.'); }
  },
  'anadir-enlace'(){
    let url = $('#enl-url').value.trim(); const desc = $('#enl-desc').value.trim();
    if (!url) return tostada('Escribe la dirección web.');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { const u = new URL(url); if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) throw 0; } catch(e){ return tostada('Esa dirección no parece una web.'); }
    ui.editor.enlaces = [...ui.editor.enlaces, {url, desc}]; guardarBorrador();
    $('#enl-url').value = ''; $('#enl-desc').value = '';
  },
  'quitar-enlace'(el){ ui.editor.enlaces = ui.editor.enlaces.filter((_, i) => i !== Number(el.dataset.i)); guardarBorrador(); },
  async 'enviar-carta'(){
    const id = sesion.id, ed = ui.editor;
    ed.texto = $('#carta-texto').value;
    if (!ed.texto.trim() && !ed.enlaces.length) return tostada('Una carta vacía no la aceptan ni los camellos.');
    const ya = cartaDe(id)?.enviada;
    if (ya && !await confirmar('El cambio se anunciará públicamente y se avisará a quien te regala. ¿Enviar la nueva versión?')) return;
    await ocupado('Los pajes reales recogen tu carta…', async () => {
      await enviarCarta(id, ed.texto, ed.enlaces);
      ls.del('azamai-borrador-' + ed.k); ui.editor = null;
      tostada(ya ? '🖋️ Nueva versión enviada.' : '👑👑👑 ¡Carta enviada! Sus Majestades te felicitan.');
    });
  },
  async 'preguntar'(){
    const t = $('#preg-texto').value.trim(), a = amigo();
    if (!t) return tostada('Escribe tu pregunta.');
    if (!a) return;
    await ocupado('Publicando de forma anónima…', async () => {
      await DB.addDoc('preguntas', {ronda:ronda(), para:a, texto:t, fecha:ahoraISO(), respuesta:null, fechaRespuesta:null});
      $('#preg-texto').value = '';
      tostada('🤫 Pregunta publicada. Nadie sabrá que has sido tú.');
    });
  },
  async 'responder'(el){
    const id = el.dataset.id, t = $('#resp-' + id).value.trim();
    if (!t) return tostada('Escribe tu respuesta.');
    await ocupado('Publicando tu respuesta…', async () => { await DB.setDoc('preguntas', id, {respuesta:t, fechaRespuesta:ahoraISO()}); tostada('💬 Respuesta publicada en el inicio.'); });
  },
  async 'celebrar'(){
    if (ronda() && !await confirmar('Ya hay un sorteo en curso. Si celebra uno nuevo, se anulan el resultado, las cartas y las preguntas actuales. ¿Procede, Majestad?')) return;
    if (!ronda() && !await confirmar('¿Celebrar el sorteo de AZAMAI? Recibirá el resultado en un documento de Word que solo usted podrá abrir.')) return;
    await ocupado('Agitando el bombo y sellando quince sobres…', async () => {
      const {pares, f, r} = await celebrarSorteo();
      ui.editor = null;
      ui.ocupado = 'Redactando el acta en Word…'; pintarYa();
      const ok = await guardarArchivo(nombreActa(), documentoActa(pares, f, r));
      ui.modal = {titulo:'📜 Sorteo celebrado', html:`<p>Majestad: el sorteo se ha celebrado y cada socio tiene ya su sobre sellado.</p><p>${ok ? 'El resultado se le ha entregado en un <b>documento de Word</b>. Ábralo para verlo: es el único lugar donde consta.' : 'No se ha guardado el documento de Word.'} Si no lo encuentra, pulse «Descargar el acta en Word» en su despacho.</p><p>Si lo encuentra conforme, pulse «Sorteo válido. Comunicar resultado».</p>`};
    });
  },
  async 'validar'(){
    if (!await confirmar('¿Declara válido el sorteo? Cada socio verá en su perfil a quién debe regalar.')) return;
    await ocupado('Comunicando el resultado a los quince socios…', async () => {
      const f = ahoraISO();
      await DB.setDoc('azamai', 'estado', {fase:'validado', fechaValidacion:f});
      await DB.addDoc('mensajes', {para:'todos', tipo:'sistema', ronda:ronda(), fecha:f, texto:'✅ ' + TXT.validoPublico});
      tostada('✅ Resultado comunicado.');
    });
  },
  async 'bajar-acta'(){
    await ocupado('Redactando el acta en Word…', async () => {
      const {pares, fecha, ronda:r} = await leerActa();
      const ok = await guardarArchivo(nombreActa(), documentoActa(pares, fecha, r));
      if (ok) tostada('📄 Acta entregada. Ábrala para ver el resultado.');
    });
  },
  async 'resellar'(){
    await ocupado('Volviendo a sellar sobres…', async () => {
      const {pares} = await leerActa();
      for (const id of IDS){
        const so = S.socios[id], a = S.asign[`${ronda()}_${id}`];
        if (so?.pub && a?.keyId !== so.keyId) await DB.setDoc('asignaciones', `${ronda()}_${id}`, {ronda:ronda(), socio:id, keyId:so.keyId, sobre:await sellar(so.pub, pares[id])}, false);
      }
      tostada('Sobres sellados de nuevo.');
    });
  },
  async 'msg-comun'(){
    const t = $('#presi-comun').value.trim(); if (!t) return;
    await DB.addDoc('mensajes', {para:'todos', tipo:'presidencia', ronda:null, fecha:ahoraISO(), texto:t});
    $('#presi-comun').value = ''; tostada('📢 Publicado en el tablón.');
  },
  async 'msg-indiv'(){
    const para = $('#presi-para').value, t = $('#presi-indiv').value.trim(); if (!t) return;
    await DB.addDoc('mensajes', {para, tipo:'presidencia', ronda:null, fecha:ahoraISO(), texto:t});
    $('#presi-indiv').value = ''; tostada(`✉️ Enviado a ${nom(para)}.`);
  },
  async 'reset-pin'(){
    const id = $('#presi-reset').value; if (!id) return;
    if (!await confirmar(`¿Restablecer el PIN de ${nom(id)}? Tendrá que crear uno nuevo.`)) return;
    await DB.delDoc('socios', id);
    await DB.addDoc('mensajes', {para:'todos', tipo:'presidencia', ronda:null, fecha:ahoraISO(), texto:`🔑 La Presidencia ha restablecido el PIN de ${nom(id)}, que deberá crear uno nuevo. Se le recuerda que la memoria también es una virtud navideña.`});
    tostada(`PIN de ${nom(id)} restablecido.`);
  },
  async 'borrar-msg'(el){
    if (!await confirmar('¿Borrar este mensaje del tablón?')) return;
    await DB.delDoc('mensajes', el.dataset.id);
  },
  // --- Prueba ---
  'p-reloj'(el){
    const d = Number(el.dataset.d); desfaseDias = d === 0 ? 0 : desfaseDias + d;
    ui.prueba = false; ls.set('azamai-desfase', String(desfaseDias)); tostada(d === 0 ? 'Reloj en la fecha real.' : `Reloj adelantado: +${desfaseDias} días.`);
  },
  async 'p-alta'(){
    await ocupado('Dando de alta a los socios que faltan…', async () => {
      const falt = IDS.filter(id => !S.socios[id]?.pub);
      for (const id of falt){ ui.ocupado = `Dando de alta a ${nom(id)}…`; pintarYa(); await darDeAlta(id, PIN_PRUEBA); }
      tostada(falt.length ? `${falt.length} socios dados de alta con PIN ${PIN_PRUEBA}.` : 'Ya estaban todos.');
      ui.prueba = false;
    });
  },
  'p-como'(){
    const id = $('#p-quien').value;
    sesion = {id, priv:null, keyId:S.socios[id]?.keyId, supervisado:true};
    cacheAmigo = {}; ui.sobre = false; ui.editor = null; ui.prueba = false; ui.ultimaVisita = null;
    location.hash = '#socio-' + id;
  },
  'p-resultado'(){
    if (!S.prueba || S.prueba.ronda !== ronda()) return tostada('No hay sorteo en curso.');
    ui.prueba = false;
    ui.modal = {titulo:'👁️ Resultado del sorteo', html:`<table class="pares">${IDS.map(id => `<tr><td><b>${esc(nom(id))}</b></td><td>→</td><td>${esc(nom(S.prueba.pares[id]))}</td></tr>`).join('')}</table><p class="nota">Solo visible en la versión de prueba.</p>`};
  },
  'p-cartas'(){
    const hay = enviadas();
    ui.prueba = false;
    ui.modal = {titulo:'👁️ Todas las cartas', html:hay.length ? hay.map(id => `<div class="pregunta">${cartaHTML(id, cartaDe(id))}</div>`).join('') : '<p class="vacio">Nadie ha enviado carta todavía.</p>'};
  },
  async 'p-cartas-auto'(){
    if (fase() !== 'validado') return tostada('Primero hay que celebrar y validar el sorteo.');
    await ocupado('Escribiendo cartas de ejemplo…', async () => {
      const falt = IDS.filter(id => !cartaDe(id)?.enviada);
      for (const id of falt) await enviarCarta(id, `Queridos Reyes Magos: soy ${nom(id)}. Este año he sido razonablemente bueno. Me gustaría una bufanda de cuadros, un libro de misterio y que la Presidenta me siga perdonando la vida.`, [{url:'https://es.wikipedia.org/wiki/Turr%C3%B3n', desc:'Turrón del blando'}]);
      tostada(`${falt.length} cartas de ejemplo enviadas.`);
      ui.prueba = false;
    });
  },
  async 'p-borrar'(){
    if (!await confirmar('¿Borrar TODOS los datos (socios, sorteo, cartas, mensajes)? No se puede deshacer.')) return;
    await ocupado('Borrando todo…', async () => {
      for (const id of Object.keys(S.socios)) await DB.delDoc('socios', id);
      for (const id of Object.keys(S.asign)) await DB.delDoc('asignaciones', id);
      for (const id of Object.keys(S.actas)) await DB.delDoc('actas', id);
      for (const id of Object.keys(S.cartas)) await DB.delDoc('cartas', id);
      for (const m of S.mensajes) await DB.delDoc('mensajes', m.id);
      for (const p of S.preguntas) await DB.delDoc('preguntas', p.id);
      await DB.delDoc('azamai', 'estado'); await DB.delDoc('azamai', 'prueba');
      sesion = null; ls.del('azamai-sesion'); desfaseDias = 0; ls.set('azamai-desfase', '0');
      try { Object.keys(localStorage).filter(k => k.startsWith('azamai-borrador') || k.startsWith('azamai-visita')).forEach(k => ls.del(k)); } catch(e){}
      cacheAmigo = {}; ui.editor = null; ui.prueba = false;
      location.hash = '#inicio';
      tostada('Todo borrado. AZAMAI renace de sus cenizas.');
    });
  }
};

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const fn = acciones[el.dataset.a];
  if (!fn) return;
  if (el.dataset.a === 'fondo-capa' && ev.target !== el) return;
  try { await fn(el, ev); } catch(e){ console.error(e); tostada('⚠️ ' + (e.message || e)); }
  pintar();
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'carta-texto' && ui.editor){ ui.editor.texto = ev.target.value; guardarBorrador(); }
});
document.addEventListener('change', ev => { if (ev.target.id === 'carta-texto') pintar(); });
window.addEventListener('hashchange', () => { ui.sobre = false; window.scrollTo(0, 0); pintar(); });

/* ---------- Decoración ---------- */
(function decorar(){
  const colores = ['#ff2b4e', '#ffcc33', '#22d36b', '#3fa9ff', '#ff3ea5', '#ffffff'];
  $('#luces').innerHTML = Array.from({length:22}, (_, i) => `<span class="bombilla" style="color:${colores[i % colores.length]};animation-delay:${(i % 4) * 0.27}s"></span>`).join('');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $('#nieve').innerHTML = Array.from({length:26}, () => {
    const s = 10 + Math.random() * 16, d = 7 + Math.random() * 10;
    return `<span class="copo" style="left:${Math.random() * 100}vw;font-size:${s}px;animation-duration:${d}s;animation-delay:-${Math.random() * d}s">${Math.random() < .2 ? '✦' : '❄'}</span>`;
  }).join('');
})();

/* ---------- Arranque ---------- */
(async function arrancar(){
  pintarYa();
  if (!window.crypto?.subtle){ $('#app').innerHTML = '<section class="tarjeta"><p>Este navegador no es compatible. Abre AZAMAI en Safari o Chrome actualizados.</p></section>'; return; }
  try { DB = FIREBASE_CONFIG ? await almacenFirebase(FIREBASE_CONFIG) : almacenEnsayo(); }
  catch(e){ console.error(e); $('#app').innerHTML = `<section class="tarjeta"><p>No se ha podido conectar con la base de datos: ${esc(e.message)}</p></section>`; return; }
  let autoIntentado = false;
  const OYENTES = {
    azamai: docs => {
      const est = docs.find(d => d.id === 'estado');
      const antes = ronda();
      S.estado = est || {fase:'abierta'};
      S.prueba = docs.find(d => d.id === 'prueba') || null;
      if (antes !== ronda()){ ui.editor = null; ui.sobre = false; }
      cacheAmigo = {};
    },
    socios: async docs => {
      S.socios = Object.fromEntries(docs.map(d => [d.id, d])); S.cargado.socios = true; cacheAmigo = {};
      if (!autoIntentado){
        autoIntentado = true;
        try {
          const g = JSON.parse(ls.get('azamai-sesion') || 'null');
          if (g && S.socios[g.id]?.privEnc){
            const priv = await abrirLlave(S.socios[g.id].privEnc, g.pin);
            sesion = {id:g.id, priv, keyId:S.socios[g.id].keyId};
            ui.ultimaVisita = ls.get('azamai-visita-' + g.id); ls.set('azamai-visita-' + g.id, ahoraISO());
          }
        } catch(e){ ls.del('azamai-sesion'); }
      }
    },
    asignaciones: docs => { S.asign = Object.fromEntries(docs.map(d => [d.id, d])); cacheAmigo = {}; },
    actas: docs => { S.actas = Object.fromEntries(docs.map(d => [d.id, d])); },
    cartas: docs => { S.cartas = Object.fromEntries(docs.map(d => [d.id, d])); },
    mensajes: docs => { S.mensajes = docs; },
    preguntas: docs => { S.preguntas = docs; }
  };
  let bajas = [], reintento = null;
  // (Re)conecta con el almacén: al abrir, al volver del segundo plano y al pulsar 🔄
  window.reconectar = function(){
    bajas.forEach(f => { try { f(); } catch(e){} });
    clearTimeout(reintento);
    bajas = Object.entries(OYENTES).map(([c, fn]) => DB.watchCol(c, async docs => {
      await fn(docs); S.sincronizado = Date.now(); pintar();
    }, () => { clearTimeout(reintento); reintento = setTimeout(window.reconectar, 4000); }));
  };
  window.reconectar();
  let ultimoAviso = Date.now();
  const alVolver = () => {
    if (document.visibilityState !== 'visible') return;
    pintar();                                   // recalcula reproches y avisos según la hora
    if (Date.now() - ultimoAviso > 3000){ ultimoAviso = Date.now(); window.reconectar(); }
  };
  document.addEventListener('visibilitychange', alVolver);
  window.addEventListener('pageshow', alVolver);
  window.addEventListener('online', alVolver);
  window.addEventListener('focus', alVolver);
  setInterval(() => { if (document.visibilityState === 'visible') pintar(); }, 60000);
})();
</script>
